name: CI

env:
  GOLANGCI_LINT_VERSION: v1.64.8

on:
  push:
    branches: [master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check format
        run: make format-check
        id: format

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Run linting
        run: make lint-check
        id: lint

      - name: Run tests and check coverage threshold
        run: make coverage-check
        id: tests

      - name: Extract coverage percentage
        if: always()
        run: |
          if [ -f ./bin/coverage.out ]; then
            COV=$(go tool cover -func=./bin/coverage.out | grep total | awk '{printf "%.1f", $3}')
            echo "COVERAGE=${COV}%" >> $GITHUB_ENV
          else
            echo "COVERAGE=unavailable" >> $GITHUB_ENV
          fi
        id: extract_cov

      - name: Post PR comment on success
        if: github.event_name == 'pull_request' && steps.format.outcome == 'success' && steps.lint.outcome == 'success' && steps.tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ All checks passed (Go 1.26)\n\nCoverage: ${{ env.COVERAGE }}`
            })

      - name: Post PR comment on failure
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fmtOutcome = '${{ steps.format.outcome }}';
            const lintOutcome = '${{ steps.lint.outcome }}';
            const testOutcome = '${{ steps.tests.outcome }}';
            
            let failedStage = 'Unknown';
            if (fmtOutcome === 'failure') {
              failedStage = 'Format check';
            } else if (lintOutcome === 'failure') {
              failedStage = 'Lint check';
            } else if (testOutcome === 'failure') {
              failedStage = 'Tests or coverage check';
            }
            
            const fmtStatus = fmtOutcome === 'success' ? 'Format ✓' : 'Format ✗';
            const lintStatus = lintOutcome === 'success' ? 'Lint ✓' : 'Lint ✗';
            const testStatus = testOutcome === 'success' ? 'Tests ✓' : 'Tests ✗';
            
            const coverageValue = process.env.COVERAGE || 'unavailable';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ CI Failed - ${failedStage} failed (Go 1.26)\n\nCoverage: ${coverageValue}\n\nPrevious checks passed: ${fmtStatus} ${lintStatus} ${testStatus}`
            })
